<title>Мои приложения</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    min-height: 100vh;

    padding:
        calc(env(safe-area-inset-top) + 28px)
        18px
        calc(env(safe-area-inset-bottom) + 28px);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(100, 140, 255, .35),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(220, 80, 255, .28),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #080a10,
            #111522 45%,
            #090b12
        );
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

.header {
    padding:
        12px 6px 22px;
}

.header h1 {
    margin: 0;

    font-size: 34px;
    line-height: 1.05;

    letter-spacing: -1.5px;
}

.header p {
    margin:
        8px 0 0;

    color:
        rgba(255,255,255,.58);

    font-size: 15px;
}

.apps {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.app-card {
    position: relative;

    display: flex;
    align-items: center;

    gap: 14px;

    min-height: 82px;

    padding:
        13px 15px;

    color: white;

    text-decoration: none;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.055)
        );

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.16),

        0 12px 35px
        rgba(0,0,0,.24);

    backdrop-filter:
        blur(28px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(180%);

    overflow: hidden;

    transition:
        transform .16s ease,
        background .16s ease;
}

.app-card::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            rgba(255,255,255,.10),
            transparent 35%
        );
}

.app-card:active {
    transform:
        scale(.975);
}

.icon {
    position: relative;
    z-index: 1;

    width: 54px;
    height: 54px;

    flex:
        0 0 54px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    font-size: 25px;
    font-weight: 700;

    box-shadow:
        inset 0 1px 2px
        rgba(255,255,255,.35),

        0 7px 18px
        rgba(0,0,0,.22);
}

.app-info {
    position: relative;
    z-index: 1;

    min-width: 0;
    flex: 1;
}

.app-name {
    font-size: 18px;
    font-weight: 650;

    letter-spacing:
        -.25px;
}

.app-version {
    margin-top: 4px;

    color:
        rgba(255,255,255,.52);

    font-size: 13px;
}

.arrow {
    position: relative;
    z-index: 1;

    color:
        rgba(255,255,255,.45);

    font-size: 31px;
    font-weight: 300;
}

.gray .icon {
    background:
        linear-gradient(
            145deg,
            #8c929b,
            #424750
        );
}

.turquoise .icon {
    background:
        linear-gradient(
            145deg,
            #36e0d0,
            #008f9b
        );
}

.green .icon {
    background:
        linear-gradient(
            145deg,
            #45dc75,
            #07883e
        );
}

.red .icon {
    background:
        linear-gradient(
            145deg,
            #ff626b,
            #a90018
        );
}

.yellow .icon {
    color: #382b00;

    background:
        linear-gradient(
            145deg,
            #ffe75c,
            #dba900
        );
}

.blue .icon {
    background:
        linear-gradient(
            145deg,
            #5ca9ff,
            #2455dc
        );
}

.purple .icon {
    background:
        linear-gradient(
            145deg,
            #d36cff,
            #7130c7
        );
}

.vkblue .icon {
    background:
        linear-gradient(
            145deg,
            #4baaff,
            #0875d8
        );
}

.footer {
    text-align: center;

    color:
        rgba(255,255,255,.32);

    font-size: 12px;

    padding:
        24px 0 5px;
}

</style>

</head>
